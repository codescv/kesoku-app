# Reference Cloud Run service definition for the Kesoku relay (Blueprint §1.1).
# Placeholders: <GCP_PROJECT_ID>, <PROJECT_NUMBER>, <REGION>, <IMAGE>, <ALLOWED_EMAILS>, <FIREBASE_WEB_API_KEY>.
# Apply with: gcloud run services replace apps/relay/cloudrun.yaml --region=<REGION> --project=<GCP_PROJECT_ID>
# (scripts/deploy-relay.sh does the equivalent with `gcloud run deploy` flags.)
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kesoku-relay
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Single instance: the WS bridge is in-memory.
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        # Keep CPU allocated so idle WebSockets are never throttled.
        run.googleapis.com/cpu-throttling: 'false'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: kesoku-relay@<GCP_PROJECT_ID>.iam.gserviceaccount.com
      containerConcurrency: 250
      # Cloud Run WebSocket ceiling; both legs rotate at ~55 min.
      timeoutSeconds: 3600
      containers:
        - image: <IMAGE>
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: ALLOWED_EMAILS
              value: <ALLOWED_EMAILS>
            - name: FIREBASE_PROJECT_ID
              value: <GCP_PROJECT_ID>
            - name: MEDIA_BUCKET
              value: kesoku-media-<PROJECT_NUMBER>
            # Optional public web config for the Web Google sign-in popup (not a secret).
            - name: FIREBASE_WEB_API_KEY
              value: <FIREBASE_WEB_API_KEY>
            - name: FIREBASE_AUTH_DOMAIN
              value: <GCP_PROJECT_ID>.firebaseapp.com
            - name: ENGINE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kesoku-relay-engine-token
                  key: latest
            - name: DEVICE_HMAC_KEY
              valueFrom:
                secretKeyRef:
                  name: kesoku-device-hmac
                  key: latest
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 30
  traffic:
    - percent: 100
      latestRevision: true
